name: Fetch ForexFactory Calendar

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
      
      - name: Install Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      - name: Scrape ForexFactory
        run: python scrape_calendar.py
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f debug_calendar.html
          git add calendar.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update calendar.json [skip ci]"
            git push
          fi
      
      - name: Upload debug HTML (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_calendar.html
          retention-days: 3
